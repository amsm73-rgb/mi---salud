<style>

<h1>Mi salud</h1><div class="mu" id="hd"></div><div id="bn"></div><div id="app"></div>
<nav><a href="#comidas"><b>🍽️</b>Comidas</a><a href="#agua"><b>💧</b>Agua</a><a href="#meds"><b>💊</b>Meds</a><a href="#analisis"><b>🩺</b>Análisis</a><a href="#periodo"><b>🌸</b>Período</a><a href="#actividad"><b>🏃</b>Actividad</a><a href="#animo"><b>🙂</b>Ánimo</a></nav>
<script>
const $=s=>document.querySelector(s),K='salud1';
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{};
const fill=()=>Object.assign(S,{hd:S.hd||{},mood:S.mood||{},goal:S.goal||2000,water:S.water||{},meals:S.meals||{},taken:S.taken||{},extra:S.extra||[],labs:S.labs||[],per:S.per||[],sym:S.sym||{},act:S.act||{}});const fix=()=>{fill();Object.values(S.mood).forEach(x=>{if(typeof x.m=='number'){if(x.med==null)x.med=x.m;delete x.m}})};fix();
S.meds=S.meds||[{id:'ros',n:'Rosuvastatina',d:'',t:'21:00',on:1},{id:'om3',n:'Omega 3',d:'',t:'13:00',on:1},{id:'vd',n:'Vitamina D',d:'',t:'09:00',on:0},{id:'cre',n:'Creatina',d:'',t:'09:00',on:0}];
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('No hay más lugar para guardar. Borrá alguna foto vieja.')}};
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),T=()=>iso(new Date()),D=s=>new Date(s+'T00:00:00');
const fd=s=>D(s).toLocaleDateString('es-UY',{weekday:'short',day:'numeric',month:'short'});
const add=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d)},diff=(a,b)=>Math.round((D(a)-D(b))/864e5);
let VD=null;const DY=()=>VD||T();
const hm=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())},L=ml=>String(+(ml/1000).toFixed(2)).replace('.',',');
const SL=['Desayuno','Media mañana','Almuerzo','Merienda','Cena'];
const dm=d=>S.meals[d]||[],tot=d=>dm(d).reduce((a,m)=>({k:a.k+m.k,s:a.s+m.s,f:a.f+m.f,b:a.b+m.b}),{k:0,s:0,f:0,b:0});
// [palabra, kcal por unidad, tipo (s=azúcar, c=carbohidrato), umbral de porción grande]
const FS=[['papas fritas',350],['cafe con leche',100],['dulce de leche',60,'s'],['arroz',200,'c',2],['fideo',220,'c',2],['tallarin',220,'c',2],['pasta',220,'c',2],['polenta',200,'c',2],['pan',130,'c',3],['tostada',70,'c',4],['papa',110],['boniato',120],['azucar',20,'s'],['mermelada',50,'s'],['miel',60,'s'],['alfajor',250,'s'],['torta',350,'s'],['helado',250,'s'],['gaseosa',140,'s'],['refresco',140,'s'],['jugo',110,'s'],['chocolatada',180,'s'],['chocolate',150,'s'],['medialuna',200,'s'],['bizcocho',150,'s'],['postre',200,'s'],['galletita',50,'s'],['budin',300,'s'],['flan',200,'s'],['brownie',300,'s'],['huevo',75],['leche',120],['cafe',5],['banana',90],['manzana',80],['naranja',60],['pera',80],['fruta',80],['pollo',250],['carne',280],['bife',280],['pescado',200],['merluza',180],['ensalada',60],['verdura',50],['sopa',150],['tortilla',200],['queso',100],['jamon',40],['atun',120],['lenteja',250],['garbanzo',250],['avena',150],['yogur',100],['frutos secos',160],['palta',160],['pizza',280],['hamburguesa',450],['tarta',250],['zapallo',50],['tomate',20],['milanesa',300],['empanada',250],['sandwich',350],['chivito',700],['cerveza',150],['vino',120],['fernet',130],['trago',150]].sort((a,b)=>b[0].length-a[0].length);
function est(t){let x=t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\bun[ao]?\b/g,'1').replace(/\bdos\b/g,'2').replace(/\btres\b/g,'3').replace(/\bcuatro\b/g,'4');
const big=/grande|abundante|doble|mucho|mucha|repeti/.test(x),fr=/frit/.test(x)||(/milanesa|empanad|churro|croquet|nugget|rabas|chivito/.test(x)&&!/horno|plancha/.test(x));
let k=0,s=0,b=0,c=0,nm=[];
for(const [w,v,f,th] of FS){x=x.replace(new RegExp('(?:(\\d+(?:[.,]\\d+)?)\\s*(?:porciones?\\s+de\\s+|de\\s+)?)?\\b'+w.replace(/ /g,'\\s+')+'(?:es|s)?\\b','g'),(m,q)=>{q=q?parseFloat(q.replace(',','.')):1;k+=v*q;nm.push(w);if(f=='s')s+=q;if(f=='c'){c=1;if(q>=th)b=1}return' '});}
return{k:Math.round(k),s,f:fr?1:0,b:(b||(c&&big))?1:0,n:nm}}
let img='';
function pick(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,260/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.6);$('#pv').src=img;$('#pv').hidden=false};im.src=r.result};r.readAsDataURL(f)}
function addMeal(){const t=$('#mt').value.trim(),kv=$('#kc').value;if(!t&&!img)return alert('Escribí qué comiste o subí una foto');if(kv==='')return alert('Poné las calorías (aunque sea aproximadas)');const e=est(t);(S.meals[DY()]=S.meals[DY()]||[]).push({sl:+$('#ms').value,t,k:Math.round(+kv),s:e.s,f:e.f,b:e.b,img});img='';save();render()}
const delMeal=i=>{S.meals[DY()].splice(i,1);save();render()};
const UPS=new Set(['papas fritas','dulce de leche','azucar','mermelada','miel','alfajor','torta','helado','gaseosa','refresco','jugo','chocolatada','chocolate','medialuna','bizcocho','postre','galletita','budin','flan','brownie','milanesa','empanada','chivito','hamburguesa','pizza','cerveza','vino','fernet','trago']),MDS=new Set(['arroz','fideo','tallarin','pasta','polenta','pan','tostada','papa','boniato','tarta','sandwich','yogur','queso']);
function trig(m){const u=new Set(),o=new Set(),k=new Set();let fr=0;m.forEach(x=>{const e=est(x.t||'');e.n.forEach(n=>(UPS.has(n)?u:MDS.has(n)?o:k).add(n));if(e.f)fr=1});if(fr)u.add('frituras');
const ch=(a,c)=>[...a].map(n=>'<span class="tag '+c+'">'+E(n)+'</span>').join(' ');
let h='<h2>Triglicéridos y mi comida</h2><div class="c">';
if(!u.size&&!o.size&&!k.size)h+='<p class="mu">Cuando anotes comidas, acá te muestro cuáles pueden subir tus triglicéridos y cuáles no.</p>';
else{if(u.size)h+='<p><b>🔺 Pueden subirlos</b><br>'+ch(u,'r')+'</p>';if(o.size)h+='<p><b>🟡 Con moderación</b> <span class="mu">(depende de la porción)</span><br>'+ch(o,'')+'</p>';if(k.size)h+='<p><b>🟢 No los suben o ayudan</b><br>'+ch(k,'g')+'</p>';h+='<p class="mu">Solo reconozco alimentos comunes: si algo no aparece, no lo pude clasificar.</p>'}
return h+'<details><summary><b>Guía rápida</b></summary><p><b>🔺 Suelen subirlos:</b> azúcar y dulces, gaseosas y jugos, alcohol, frituras, harinas blancas en exceso, pizza y comidas muy grasas.</p><p><b>🟡 Con moderación:</b> arroz, fideos, pan y papa (cuidá el tamaño de la porción), lácteos enteros.</p><p><b>🟢 Ayudan:</b> pescado (sobre todo el azul), verduras, legumbres, avena, frutas enteras, frutos secos y palta en porciones chicas.</p></details><p class="mu">Es una guía general. Lo que te conviene a vos lo define tu doctora o nutricionista.</p></div>'}
function vComidas(){const hy=DY()==T()?'Hoy':'Ese día';const m=dm(DY()),t=tot(DY()),g=S.goal;let a='';
if(t.k>g)a='<div class="al b">Te pasaste por '+(t.k-g)+' kcal de tu meta</div>';
else a=(DY()==T()&&new Date().getHours()>=21&&t.k<g*.7)?'<div class="al w">Te faltan '+(g-t.k)+' kcal para tu meta de hoy</div>':'<div class="al ok">Te quedan '+(g-t.k)+' kcal para tu meta</div>';
if(t.s>=3)a+='<div class="al w">🍬 '+hy+' comiste bastante azúcar agregada. Cuidá tus triglicéridos.</div>';
if(t.f>=1)a+='<div class="al w">🍟 '+hy+' comiste frituras. Cuidá tus triglicéridos.</div>';
if(t.b>=1)a+='<div class="al w">🍝 '+hy+' hubo porciones grandes de arroz, fideos o pan. Cuidá tus triglicéridos.</div>';
let h='<h2>Comidas del día</h2><div class="c"><label>Mi meta diaria (kcal)<input type="number" inputmode="numeric" value="'+g+'" onchange="S.goal=+this.value||2000;save();render()"></label><div style="font-size:30px;font-weight:800">'+t.k+' <span class="mu">kcal</span></div>'+(bu(DY())?'<div class="mu">🔥 Gastaste ~'+bu(DY())+' kcal en actividad · Balance: '+(t.k-bu(DY()))+' kcal</div>':'')+'</div>'+a;
h+='<div class="c"><label>Comida<select id="ms">'+SL.map((s,i)=>'<option value="'+i+'">'+s+'</option>').join('')+'</select></label><label>¿Qué comiste?<textarea id="mt" rows="2" placeholder="ej. 2 tostadas con queso y café con leche" oninput="$(\'#kc\').value=est(this.value).k||\'\'"></textarea></label><label>Calorías (estimadas, corregilas si hace falta)<input id="kc" type="number" inputmode="numeric"></label><label>Foto (opcional)<input type="file" accept="image/*" onchange="pick(event)"></label><img id="pv" class="ph" hidden><button class="bt" onclick="addMeal()">Agregar comida</button></div>';
h+='<h2>Resumen del día</h2><div class="c">'+(m.length?SL.map((s,i)=>{const r=m.map((x,j)=>[x,j]).filter(p=>p[0].sl==i);return r.length?'<b>'+s+'</b>'+r.map(p=>'<button class="x" onclick="delMeal('+p[1]+')">✕</button><div>'+E(p[0].t||'(foto)')+' — <b>'+p[0].k+' kcal</b></div>'+(p[0].img?'<img class="ph" src="'+p[0].img+'">':'')).join('')+'<hr>':''}).join('')+'<b>Total: '+t.k+' de '+g+' kcal</b>':'<span class="mu">Todavía no anotaste nada.</span>')+'</div>';return h+trig(m)}
const wa=()=>S.water[DY()]||0;
function glass(n){S.water[DY()]=Math.max(0,wa()+n*250);save();render()}
function vAgua(){const w=wa(),p=Math.min(100,w/27);return '<h2>Agua</h2><div class="c"><div style="font-size:30px;font-weight:800">'+L(w)+' <span class="mu">de 2,7 L</span></div><div class="bar"><i style="width:'+p+'%"></i></div><p>'+(w>=2700?'¡Meta cumplida! 🎉':'Te faltan '+L(2700-w)+' litros.')+'</p><button class="bt" onclick="glass(1)">+ 1 vaso (250 ml)</button><button class="ln" onclick="glass(-1)">Quitar un vaso</button></div>'}
function takeMed(i){const k=DY();S.taken[k]=S.taken[k]||{};S.taken[k][S.meds[i].id]=!S.taken[k][S.meds[i].id];save();render()}
const onMed=(i,v)=>{S.meds[i].on=v;save();render()};
function addX(){const n=$('#xn').value.trim();if(!n)return alert('Escribí qué tomaste');S.extra.push({d:DY(),n,t:$('#xt').value,w:$('#xw').value,e:$('#xe').value});save();render()}
const delX=i=>{S.extra.splice(i,1);save();render()};
function notif(){if('Notification'in window)Notification.requestPermission().then(()=>render())}
function vMeds(){const tk=S.taken[DY()]||{},n=hm();
let h='<h2>Medicamentos y suplementos</h2>'+S.meds.map((m,i)=>{if(!m.on)return '<div class="c"><b>'+E(m.n)+'</b><span class="tag">Pendiente</span><button class="bt g" onclick="onMed('+i+',1)">Empezar a tomarla</button></div>';const d=tk[m.id];
return '<div class="c"><b>'+E(m.n)+'</b>'+(d?'<span class="tag g">Tomada ✓</span>':DY()<T()?'<span class="tag r">No la tomaste</span>':n>=m.t?'<span class="tag r">¡Te olvidaste!</span>':'<span class="tag">Hoy a las '+m.t+'</span>')+'<button class="bt '+(d?'g':'')+'" onclick="takeMed('+i+')">'+(d?'✓ Ya la tomé':'Marcar como tomada')+'</button><div class="row"><label>Dosis<input value="'+E(m.d)+'" placeholder="ej. 10 mg" onchange="S.meds['+i+'].d=this.value;save()"></label><label>Hora<input type="time" value="'+m.t+'" onchange="S.meds['+i+'].t=this.value||\'09:00\';save();render()"></label></div><button class="ln" onclick="onMed('+i+',0)">Dejar en pendiente</button></div>'}).join('');
h+='<p class="mu">Los avisos del celular funcionan mientras la app esté abierta. Si no, igual te muestro un aviso rojo arriba cuando se pasa la hora.</p>'+('Notification'in window&&Notification.permission=='default'?'<button class="bt g" onclick="notif()">Activar avisos del celular</button>':'');
const hoy=S.extra.map((x,i)=>[x,i]).filter(p=>p[0].d==DY()),ant=S.extra.map((x,i)=>[x,i]).filter(p=>p[0].d!=DY()).slice(-5).reverse();
h+='<h2>Medicamento extra</h2><div class="c"><p class="mu">Solo queda anotado en el día, no se repite todos los días.</p><label>¿Qué tomaste?<input id="xn" placeholder="ej. ibuprofeno, antiácido"></label><div class="row"><label>Hora<input id="xt" type="time" value="'+n+'"></label><label>¿Hizo efecto?<select id="xe"><option>Sí</option><option>Un poco</option><option>No</option></select></label></div><label>¿Por qué lo tomaste?<select id="xw"><option>Dolor de cabeza</option><option>Período</option><option>Dolor de espalda</option><option>Acidez</option><option>Otro</option></select></label><button class="bt" onclick="addX()">Guardar medicamento extra</button></div>';
const li=p=>'<div class="c"><button class="x" onclick="delX('+p[1]+')">✕</button><b>'+E(p[0].n)+'</b> a las '+p[0].t+'<br>Motivo: '+E(p[0].w)+' · Efecto: '+E(p[0].e)+'<br><span class="mu">'+fd(p[0].d)+'</span></div>';
return h+(hoy.length?'<h2>Extras del día</h2>'+hoy.map(li).join(''):'')+(ant.length?'<h2>Anteriores</h2>'+ant.map(li).join(''):'')}
function chart(p,c){p=p.slice(-8);if(!p.length)return '<p class="mu">Todavía no hay datos.</p>';const W=320,H=150,P=30,v=p.map(x=>x.v),mn=Math.min(...v),r=(Math.max(...v)-mn)||1,X=i=>p.length>1?P+i*(W-2*P)/(p.length-1):W/2,Y=y=>H-P-(y-mn)/r*(H-2*P);
return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="color:var(--tx)"><polyline fill="none" stroke="'+c+'" stroke-width="3" points="'+p.map((x,i)=>X(i)+','+Y(x.v)).join(' ')+'"/>'+p.map((x,i)=>'<circle cx="'+X(i)+'" cy="'+Y(x.v)+'" r="5" fill="'+c+'"/><text x="'+X(i)+'" y="'+(Y(x.v)-10)+'" text-anchor="middle" font-size="13" fill="currentColor">'+x.v+'</text><text x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10" fill="currentColor">'+x.d.slice(5).split('-').reverse().join('/')+'</text>').join('')+'</svg>'}
function addLab(k){const d=$('#'+k+'d').value,v=$('#'+k).value;if(!d||v==='')return alert('Poné la fecha y el resultado');S.labs.push({d,[k]:+v});S.labs.sort((a,b)=>a.d<b.d?-1:1);save();render()}
function delLab(i,k){const l=S.labs[i];l[k]=null;if(l.tg==null&&l.vd==null)S.labs.splice(i,1);save();render()}
function vAnalisis(){const sr=k=>S.labs.filter(l=>l[k]!=null).map(l=>({d:l.d,v:l[k]})),

return h}
